<!doctype html>
<html>
<head>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}" />
    <link rel="shortcut icon"
          href="{{ url_for('static', filename='favicon-32x32.png') }}">
    <link href="https://fonts.cdnfonts.com/css/futura-pt" rel="stylesheet">
    <style>
        @import url('https://fonts.cdnfonts.com/css/futura-pt');
    </style>
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet-geosearch@3.0.0/dist/geosearch.css"
    />
    <!-- Make sure you put this AFTER Leaflet's CSS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
    <script src="https://unpkg.com/leaflet-geosearch@latest/dist/bundle.min.js"></script>
    <script src="{{ url_for('static', filename='markdown.js') }}"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/showdown/1.9.0/showdown.min.js"></script>
    <script src="{{ url_for('static', filename='utils.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body class="bg-stone-50 text-zinc-800 p-2">
    <div class="flex flex-col min-h-screen">
        <header class="bg-stone-100 py-2" id="header">
            {% block header %}{% endblock %}
        </header>
        <div class="flex flex-col md:flex-row flex-grow mb-2" id="container">
            {% block container %}{% endblock %}
        </div>
        <footer class="bg-slate-300 p-4 mb-2 divide-x-1 divide-dashed text-center">
            <span class="inline px-2" id="copyright">© Copyright 2025, Gautam Joshi</span>
            <a href="https://www.podbean.com/site/EpisodeDownload/DIR24D2598DMKVJX" class="inline px-2" id="footer-read-this">Listen to this</a>
            <a href="https://web.archive.org/web/20250328211825/https://defector.com/kingdom-of-the-biters" class="inline px-2" id="footer-head-this">Read this</a>
            <a href="https://mappingprejudice.umn.edu/take-action/volunteer" class="inline px-2" id="footer-then-do-this">Then do this</a>
            <a href="https://bsky.app/profile/isoughtajam.bsky.social" class="inline px-2" id="footer-support">Please support this project</a>
        </footer>
    </div>
</body>
</html>
