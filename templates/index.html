<html>
<head>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}" />
    <link rel="stylesheet"
          href="{{ url_for('static', filename='skeleton.css') }}" />
    <link rel="shortcut icon"
          href="{{ url_for('static', filename='favicon-32x32.png') }}">
     <!-- Make sure you put this AFTER Leaflet's CSS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
    <script src="{{ url_for('static', filename='markdown.js') }}"></script>
</head>
<body>
    <div id="map">
        <script src="{{ url_for('static', filename='editing.js') }}"></script>
        <script>
            getMarkersAndDisplay();
        </script>
    </div>
    <div id="create-form">
        <span class="close-form" onclick="hideForm(); clearEditLGMarkers();">
            x</span>
        <h1 class="form-title">Enter data for location</h1>
        <form method="POST" onsubmit="submitMarker();" action="/pin" enctype="multipart/form-data">
            <div class="row">
                <label htmlFor="title">Title:</label>
                <input
                        type="text"
                        id="create-form-title-input"
                        name="title"
                        placeholder="Fox Theater"
                />
            </div>
            <div>
                <label htmlFor="description" class="u-full-width">Description
                    :</label>
                <textarea
                        id="create-form-desc-input"
                        oninput="this.editor.update()"
                        name="desc"
                        class="u-full-width"
                        placeholder="The Fox Theater is the best live music venue in the East Bay."
                ></textarea>
            </div>
            <div>
                <label htmlFor="layer">Layer:</label>
                <input
                        type="text"
                        id="create-form-layer-input"
                        name="layer"
                        value="faves"
                />
            </div>
            <button type="submit" id="close-form-button"
                    class="button-primary">Map it.</button>
        </form>
        <hr id="markdown-preview-divider">
        <h6 id="markdown-preview-title">Description preview:</h6>
        <div id="preview"> </div>
        <script>
            function Editor(input, preview) {
                this.update = function () {
                    preview.innerHTML = markdown.toHTML(input.value);
                };
                input.editor = this;
                this.update();
            }
            var $ = function (id) { return document.getElementById(id); };
            new Editor($("create-form-desc-input"), $("preview"));
        </script>
    </div>
</body>
</html>
