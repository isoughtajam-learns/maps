<html>
<head>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}" />
     <!-- Make sure you put this AFTER Leaflet's CSS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
</head>
<body>
    <div id="map">
        <script src="{{ url_for('static', filename='editing.js') }}"></script>
        <script>
            getMarkersAndDisplay();
            // debugger;
            // paintMarkers(markersToPaint);
        </script>
    </div>
    <div id="create-form">
        <span class="close-form" onclick="hideForm(); clearEditLGMarkers();">
            x</span>
        <h1 class="form-title">Enter data for location</h1>
        <form>
            <div>
                <label htmlFor="name">Name:</label>
                <input
                        type="text"
                        id="create-form-name-input"
                        name="name"
                        value="Mickey Mouse"
                />
            </div>
            <div>
                <label htmlFor="description">Description:</label>
                <input
                        type="text"
                        id="create-form-desc-input"
                        name="desc"
                        value="i love this place"
                />
            </div>
            <div>
                <label htmlFor="tag">Tag:</label>
                <input
                        type="text"
                        id="create-form-tag-input"
                        name="tag"
                        value="faves"
                />
            </div>
            <button type="submit" id="close-form-button"
                    onclick="submitMarker();">Submit
            </button>
        </form>
    </div>
</body>
</html>
